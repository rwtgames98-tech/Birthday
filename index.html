<title>Happy Birthday</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: "Georgia", "Times New Roman", serif;
}

body{
    height:100vh;
    background: radial-gradient(circle at top, #2c2c54, #0a0a23);
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#f5f5f5;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:-1;
}

.center{
    text-align:center;
}

.hidden{
    display:none;
}

/* Countdown */
.countdown{
    font-size:4.5rem;
    font-weight:bold;
    letter-spacing:5px;
    animation: fadeScale 1s ease;
}

@keyframes fadeScale{
    from{opacity:0; transform:scale(0.7)}
    to{opacity:1; transform:scale(1)}
}

/* Cake */
.cake{
    width:220px;
    margin:20px auto;
}

.layer{
    height:55px;
    background:linear-gradient(#d4a373,#b07d45);
    border-radius:8px;
    margin-top:6px;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.2);
}

.icing{
    height:16px;
    background:#f3f3f3;
    border-radius:8px;
}

.candle{
