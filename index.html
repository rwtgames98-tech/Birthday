<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Georgia', serif;}

body{
  background: radial-gradient(circle at top, #1a1a40, #000010);
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
  overflow:hidden;
}

.container{
  max-width:90%;
}

button{
  padding:14px 26px;
  font-size:18px;
  border:none;
  border-radius:30px;
  background:#ffffff;
  color:#000;
  cursor:pointer;
}

#count{
  font-size:80px;
  margin:20px 0;
  display:none;
}

#content{
  display:none;
  animation: fadeIn 2s ease forwards;
}

h1{
  font-size:42px;
  margin-bottom:10px;
}

p{
  font-size:18px;
  line-height:1.6;
}

.design{
  font-size:28px;
  margin:20px 0;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(0.9);}
  to{opacity:1; transform:scale(1);}
}

/* fireworks */
.firework{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  animation: explode 1.5s ease-out forwards;
}

@keyframes explode{
  from{transform:scale(0); opacity:1;}
  to{transform:scale(4); opacity:0;}
}
</style>
</head>

<body>

<div class="container">

<button id="start">Tap to Begin</button>

<div id="count">3</div>

<div id="content">
  <div class="design">✨🎉💖🌸✨</div>

  <h1>Happy Birthday</h1>
  <p>
    Wishing you a very happy birthday<br>
    dear <b>Shraddha</b><br><br>
    <i>19 January 2026</i>
  </p>

  <div class="design">🌙💫🌷💞🌙</div>
</div>

</div>

<audio id="music" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_7a3b62b7e1.mp3">
</audio>

<script>
const btn = document.getElementById("start");
const count = document.getElementById("count");
const content = document.getElementById("content");
const music = document.getElementById("music");

btn.addEventListener("click", async ()=>{
  btn.style.display="none";

  try{
    await music.play();
  }catch(e){}

  let n=3;
  count.style.display="block";
  count.innerText=n;

  let timer=setInterval(()=>{
    n--;
    if(n>0){
      count.innerText=n;
    }else{
      clearInterval(timer);
      count.style.display="none";
      content.style.display="block";
      fireworks();
    }
  },1000);
});

function fireworks(){
  for(let i=0;i<35;i++){
    const f=document.createElement("div");
    f.className="firework";
    f.style.left=Math.random()*100+"vw";
    f.style.top=Math.random()*100+"vh";
    f.style.background=`hsl(${Math.random()*360},100%,60%)`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1500);
  }
}
</script>

</body>
</html>
