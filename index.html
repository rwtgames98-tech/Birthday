<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: "Playfair Display", serif;}

body{
  height:100vh;
  background: linear-gradient(180deg,#0b1026,#000);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  text-align:center;
}

.container{
  max-width:90%;
  animation: fade 2s ease forwards;
}

button{
  padding:14px 28px;
  font-size:18px;
  border:none;
  border-radius:40px;
  background:#fff;
  color:#000;
  cursor:pointer;
}

#count{
  font-size:90px;
  display:none;
  margin:20px 0;
}

#content{display:none;}

h1{
  font-size:44px;
  letter-spacing:2px;
}

p{
  font-size:18px;
  margin-top:14px;
  line-height:1.7;
}

.design{
  font-size:26px;
  margin:22px 0;
  opacity:0.9;
}

.firework{
  position:absolute;
  width:6px;
  height:6px;
  border-radius:50%;
  animation: boom 1.6s ease-out forwards;
}

@keyframes boom{
  from{transform:scale(0);opacity:1;}
  to{transform:scale(5);opacity:0;}
}

@keyframes fade{
  from{opacity:0;transform:scale(.95);}
  to{opacity:1;transform:scale(1);}
}
</style>
</head>

<body>

<div class="container">

<button id="start">Begin</button>

<div id="count">3</div>

<div id="content">
  <div class="design">✨ 🌸 💫 💖 🌙 ✨</div>

  <h1>Happy Birthday</h1>

  <p>
    Wishing you a very happy birthday<br>
    dear <b id="name">Shraddha</b><br><br>
    19 January 2026
  </p>

  <div class="design">🌷 💞 ⭐ 🌙 ✨</div>
</div>

</div>

<audio id="music" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2023/03/14/audio_3c7f9c0e52.mp3">
</audio>

<script>
const btn=document.getElementById("start");
const count=document.getElementById("count");
const content=document.getElementById("content");
const music=document.getElementById("music");

// name from URL
const params=new URLSearchParams(window.location.search);
const n=params.get("name");
if(n) document.getElementById("name").innerText=n;

btn.onclick=async()=>{
  btn.style.display="none";
  try{await music.play();}catch(e){}

  let i=3;
  count.style.display="block";
  count.innerText=i;

  const t=setInterval(()=>{
    i--;
    if(i>0){count.innerText=i;}
    else{
      clearInterval(t);
      count.style.display="none";
      content.style.display="block";
      setInterval(fireworks,1200);
    }
  },1000);
};

function fireworks(){
  for(let i=0;i<30;i++){
    const f=document.createElement("div");
    f.className="firework";
    f.style.left=Math.random()*100+"vw";
    f.style.top=Math.random()*100+"vh";
    f.style.background=`hsl(${Math.random()*360},100%,65%)`;
    document.body.appendChild(f);
    setTimeout(()=>f.remove(),1600);
  }
}
</script>

</body>
</html>
